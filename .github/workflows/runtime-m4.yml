name: Runtime event stream and inspector
on:
  push:
    branches: [main]
    paths: ["Sources/Engine/**", "Sources/Interposition/**", "Tools/**", "Inspector/**", "Tests/RuntimeEvents/**", "Tests/Inspector/**", "scripts/build-runtime.sh", "scripts/build-inspector.sh", ".github/workflows/runtime-m4.yml"]
  pull_request:
    paths: ["Sources/Engine/**", "Sources/Interposition/**", "Tools/**", "Inspector/**", "Tests/RuntimeEvents/**", "Tests/Inspector/**", "scripts/build-runtime.sh", "scripts/build-inspector.sh", ".github/workflows/runtime-m4.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-m4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-events:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CKSIM_TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          mkdir -p "$RUNNER_TEMP/m4-build"
          xcodebuild -version | tee "$RUNNER_TEMP/m4-build/xcode.txt"
          python3 -c "import subprocess; subprocess.run(['xcrun', 'simctl', 'list', 'runtimes', '-j'], check=True, timeout=60)" > "$RUNNER_TEMP/m4-build/runtimes.json"
          uname -m
          sysctl -n hw.memsize
      - name: Watcher and existing CLI controls
        run: |
          python3 Tests/RuntimeEvents/test_watch.py
          python3 Tests/RuntimeEvents/test_native_runner.py
          python3 Tests/RuntimeEvents/test_ci_simulator.py
          python3 Tests/Inspector/test_bridge.py
          python3 Tests/Inspector/test_timing_references.py
          python3 Tests/Inspector/test_timing_receipts.py
          python3 discovery/check_cli_controls.py
          python3 discovery/check_lck_provider_policy.py
      - name: Build simulator runtime and event fixture
        run: |
          set -o pipefail
          CKSIM_BUILD_ARCHS="$(uname -m)" bash scripts/build-runtime.sh "$RUNNER_TEMP/runtime" 2>&1 | tee "$RUNNER_TEMP/m4-build/runtime.log"
          bash Tests/RuntimeEvents/build.sh "$RUNNER_TEMP/fixture" 2>&1 | tee "$RUNNER_TEMP/m4-build/fixture.log"
          bash scripts/build-inspector.sh "$RUNNER_TEMP/inspector" 2>&1 | tee "$RUNNER_TEMP/m4-build/inspector.log"
      - name: Create the single owned simulator
        run: |
          python3 Tests/RuntimeEvents/ci_simulator.py create --runtime "$CKSIM_TEST_RUNTIME" \
            --id-file "$RUNNER_TEMP/m4-simulator-id" --env-file "$GITHUB_ENV"
      - name: Consume the shared channel through watch
        run: |
          python3 Tests/RuntimeEvents/run.py --package "$RUNNER_TEMP/runtime" \
            --app "$RUNNER_TEMP/fixture/RuntimeEventFixture.app" --out "$RUNNER_TEMP/m4-events" \
            --runtime "$CKSIM_TEST_RUNTIME" --simulator "$CKSIM_TEST_SIMULATOR"
      - name: Follow an incoming call through the live SwiftUI inspector
        run: |
          python3 Tests/Inspector/run.py --package "$RUNNER_TEMP/runtime" \
            --fixture "$RUNNER_TEMP/fixture/RuntimeEventFixture.app" \
            --inspector "$RUNNER_TEMP/inspector/CKSimInspector.app" --out "$RUNNER_TEMP/m4-inspector" \
            --runtime "$CKSIM_TEST_RUNTIME" --driver journal \
            --target-simulator "$CKSIM_TEST_SIMULATOR" --fixture-installed
      - name: Delete the owned simulator
        if: always()
        run: python3 Tests/RuntimeEvents/ci_simulator.py cleanup --id-file "$RUNNER_TEMP/m4-simulator-id"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m4-event-channel
          path: |
            ${{ runner.temp }}/m4-build
            ${{ runner.temp }}/m4-events
            ${{ runner.temp }}/m4-inspector
            ${{ runner.temp }}/m4-simulator-id
            !${{ runner.temp }}/m4-inspector/ui-build
          if-no-files-found: warn
          retention-days: 7
      - name: Remove generated builds
        if: always()
        run: rm -rf "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/inspector" "$RUNNER_TEMP/m4-inspector/ui-build"
